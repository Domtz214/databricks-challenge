command: ["streamlit", "run", "app.py"]
env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: DOCTOR_CATALOG
    value: workspace
  - name: DOCTOR_SCHEMA
    value: doctor
  - name: DOCTOR_LLM_ENDPOINT      # any tool-calling chat model from Serving
    value: databricks-meta-llama-3-3-70b-instruct
  - name: DOCTOR_GENIE_SPACE_ID   # injected from the app's "genie-space" resource (Edit app -> Resources)
    valueFrom: genie-space
  - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
    value: "false"
